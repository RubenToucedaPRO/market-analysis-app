# Spring Boot Application Properties

# Application Info
spring.application.name=market-analysis-app

# ⚠️ IMPORTANTE: Cambiar según el entorno
# - Desarrollo local: dev
# - Docker local: docker
# - Producción: prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Fuerza a Spring AOP a generar proxies basados en la clase concreta (CGLIB) en lugar de la interfaz.
# Necesario en Arquitectura Hexagonal para que Spring detecte la anotación @Retry colocada
# en el adaptador de infraestructura (OpenRouter) al inyectar el puerto
# en los casos de uso, evitando contaminar el dominio con dependencias del framework.
spring.aop.proxy-target-class=true

# Server Configuration App Spring Boot
# ${PORT:8080}: Railway inyecta su puerto en $PORT; en local se usa 8080.
server.port=${PORT:8080}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.devtools.restart.enabled=true

# Finnhub API Configuration
finnhub.api.token=${FINNHUB_API_TOKEN:}
finnhub.base.url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}

# Throttler explícito de Finnhub (ventana deslizante, mismo patrón que PolygonAdapter).
# 55 llamadas / 65s deja margen bajo el límite gratuito de Finnhub (60/min).
finnhub.ratelimit.max-calls=55
finnhub.ratelimit.window-ms=65000

# Throttler explícito de Polygon (ventana deslizante).
# 5 llamadas / 62s deja margen bajo el límite gratuito de Polygon (5/min).
polygon.ratelimit.max-calls=5
polygon.ratelimit.window-ms=62000

# Retry config for OpenRouter (429 handling)
resilience4j.retry.instances.openrouterClient.maxAttempts=3
resilience4j.retry.instances.openrouterClient.waitDuration=2s
resilience4j.retry.instances.openrouterClient.enableExponentialBackoff=true
resilience4j.retry.instances.openrouterClient.exponentialBackoffMultiplier=2
resilience4j.retry.instances.openrouterClient.retryExceptions=com.openai.errors.RateLimitException

# Polygon.io API Configuration
polygon.api.token=${POLYGON_API_TOKEN:}
polygon.base.url=${POLYGON_BASE_URL:https://api.polygon.io/}

# Finviz Screener Configuration
finviz.base.url=${FINVIZ_BASE_URL:https://finviz.com/screener.ashx}
finviz.user-agent=${FINVIZ_USER_AGENT:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36}
finviz.timeout-ms=${FINVIZ_TIMEOUT_MS:8000}
finviz.max-retries=${FINVIZ_MAX_RETRIES:1}
finviz.default.country-filter=${FINVIZ_DEFAULT_COUNTRY_FILTER:geo_usa}
finviz.default.industry-filter=${FINVIZ_DEFAULT_INDUSTRY_FILTER:ind_stocksonly}

# Openrouter API Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:google/gemma-4-26b-a4b-it:free}
# Modelos de reserva (separados por comas): si el principal devuelve 429 se
# prueba con el siguiente. Cambiable por env sin tocar código. La cuota diaria
# gratuita (50/día) es compartida por todos: no evita el cap diario, solo la
# saturación del proveedor o los límites por minuto.
openrouter.fallback-models=${OPENROUTER_FALLBACK_MODELS:meta-llama/llama-3.3-70b-instruct:free,openai/gpt-oss-20b:free}
openrouter.temperature=${OPENROUTER_TEMPERATURE:0.57}
openrouter.max-tokens=${OPENROUTER_MAX_TOKENS:1000}
openrouter.top-p=${OPENROUTER_TOP_P:0.9}
openrouter.frequency-penalty=${OPENROUTER_FREQUENCY_PENALTY:0.5}

# Suggest-tickers async jobs (B1: POST returns a job id, worker runs in background).
# Single thread: the Polygon budget (5/min) is shared; parallel jobs would all get slower.
suggest.executor.pool-size=1
suggest.executor.queue-capacity=2
suggest.executor.thread-prefix=suggest-
# Terminal jobs (DONE/FAILED) are purged after this TTL (minutes).
suggest.job.ttl-minutes=60

# AI-valoration async jobs (same pattern as suggest-tickers).
# Single thread: the OpenRouter free quota (50/day) is shared; parallel jobs
# would burn it faster and trigger more 429s.
ia.executor.pool-size=1
ia.executor.queue-capacity=5
ia.executor.thread-prefix=ia-
ia.job.ttl-minutes=60

# How often expired background jobs are purged (ms). Shared by both flows.
job.cleanup-interval-ms=1800000

# Security Configuration
app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:admin}

# Logging Configuration
logging.level.com.market.analysis=INFO

# Formateo (Ayuda a leer el log en cualquier entorno)
spring.jpa.properties.hibernate.format_sql=false

# Necesario para ver los mensajes de advertencia de Hibernate sobre lentitud
logging.level.org.hibernate.SQL_SLOW=DEBUG

spring.jpa.open-in-view=false
