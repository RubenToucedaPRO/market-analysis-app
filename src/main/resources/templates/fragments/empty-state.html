<!-- fragments/empty-state.html -->
<div th:fragment="emptyState(iconClass, title, description, actionText, actionHref)" class="text-center py-5">
  <i th:class="${iconClass}" style="font-size: 4rem"></i>
  <h4 class="text-muted mt-3" th:text="${title}">Sin datos</h4>
  <p class="text-muted fs-5 mb-4 mx-auto" style="max-width: 500px" th:text="${description}">No hay elementos para mostrar.</p>
  <div th:if="${actionText != null}" class="text-center">
    <a th:href="${actionHref}" class="btn btn-primary btn-lg">
      <span th:text="${actionText}">Crear</span>
    </a>
  </div>
</div>
