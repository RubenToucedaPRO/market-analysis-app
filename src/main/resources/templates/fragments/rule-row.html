<!-- templates/fragments/rule-row.html -->
<div th:fragment="ruleRow" class="rule-row card mb-2">
  <div class="card-body">
    <div class="row g-1 align-items-end">
      <!-- Rule Name -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          Nombre de la Regla
          <input
            type="text"
            class="form-control form-control-sm"
            th:name="|rules[${index}].name|"
            th:value="${rule != null ? rule.name : ''}"
            placeholder="Nombre de la Regla"
            required
          />
        </label>
      </div>

      <!-- Subject Indicator -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          Indicador de Sujeto
          <select
            class="form-select form-select-sm"
            th:name="|rules[${index}].subjectCode|"
            th:onchange="|toggleSubjectParameter(this, ${index})|"
            required
          >
            <option value="" data-requires-param="false" data-allowed-params="[]" data-any-param="false">
              -- Seleccionar Indicador --
            </option>
            <option
              th:each="rd : ${ruleDefinitions}"
              th:value="${rd.code}"
              th:text="${rd.name}"
              th:attr="data-requires-param=${rd.requiresParam},data-any-param=${rd.anyParamAllowed}"
              th:data-allowed-params="${rd.allowedParams}"
              th:selected="${rule != null && rule.subjectCode == rd.code}"
            ></option>
          </select>
        </label>
      </div>

      <!-- Subject Parameter -->
      <div
        th:id="|subject-container-${index}|"
        class="col-md-2"
        th:with="selectedDef=${rule != null ? ruleDefinitions.?[code == #root.rule.subjectCode].^[true] : null}"
        th:style="${selectedDef == null || !selectedDef.requiresParam} ? 'display: none;' : ''"
      >
        <label class="form-label small text-muted">
          Parámetro de Sujeto
          <!-- Select for indicators with a fixed set of allowed params -->
          <select
            th:id="|subject-param-select-${index}|"
            th:name="|rules[${index}].subjectParam|"
            class="form-select form-select-sm"
            th:if="${selectedDef != null && selectedDef.requiresParam && !selectedDef.allowedParams.isEmpty()}"
            th:required="${selectedDef != null && selectedDef.requiresParam && !selectedDef.allowedParams.isEmpty()}"
          >
            <option value="">-- Valor --</option>
            <option
              th:each="p : ${selectedDef.allowedParams}"
              th:value="${p}"
              th:text="${p}"
              th:selected="${rule != null && rule.subjectParam == p}"
            ></option>
          </select>
          <!-- Number input for free-param or fallback when no definition matched -->
          <input
            th:id="|subject-param-input-${index}|"
            type="number"
            step="0.01"
            class="form-control form-control-sm"
            th:name="|rules[${index}].subjectParam|"
            th:value="${rule != null ? rule.subjectParam : ''}"
            placeholder="0.00"
            th:if="${selectedDef == null || !selectedDef.requiresParam || selectedDef.allowedParams.isEmpty()}"
            th:required="${selectedDef != null && selectedDef.requiresParam && selectedDef.allowedParams.isEmpty()}"
          />
        </label>
      </div>

      <!-- Operator -->
      <div class="col-md-1">
        <label class="form-label small text-muted">
          Operador
          <select
            class="form-select form-select-sm"
            th:name="|rules[${index}].operator|"
          >
            <option
              value=">"
              th:selected="${rule != null && rule.operator == '>'}"
            >
              >&gt;
            </option>
            <option
              value="<"
              th:selected="${rule != null && rule.operator == '<'}"
            >
              &lt;
            </option>
            <option
              value="="
              th:selected="${rule != null && rule.operator == '='}"
            >
              >=
            </option>
          </select>
        </label>
      </div>

      <!-- Target Indicator -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          Indicador de Objetivo
          <select
            class="form-select form-select-sm"
            th:name="|rules[${index}].targetCode|"
            th:onchange="|toggleTargetParameter(this, ${index})|"
            required
          >
            <option value="" data-requires-param="false" data-allowed-params="[]" data-any-param="false">
              -- Seleccionar Indicador --
            </option>
            <option
              th:each="rd : ${ruleDefinitions}"
              th:value="${rd.code}"
              th:text="${rd.name}"
              th:attr="data-requires-param=${rd.requiresParam},data-any-param=${rd.anyParamAllowed}"
              th:data-allowed-params="${rd.allowedParams}"
              th:selected="${rule != null && rule.targetCode == rd.code}"
            ></option>
          </select>
        </label>
      </div>

      <!-- Target Value -->
      <div
        th:id="|target-container-${index}|"
        class="col-md-2"
        th:with="selectedTargetDef=${rule != null ? ruleDefinitions.?[code == #root.rule.targetCode].^[true] : null}"
        th:style="${selectedTargetDef == null || !selectedTargetDef.requiresParam} ? 'display: none;' : ''"
      >
        <label class="form-label small text-muted">
          Valor de Objetivo
          <!-- Select for indicators with a fixed set of allowed params -->
          <select
            th:id="|target-param-select-${index}|"
            th:name="|rules[${index}].targetParam|"
            class="form-select form-select-sm"
            th:if="${selectedTargetDef != null && selectedTargetDef.requiresParam && !selectedTargetDef.allowedParams.isEmpty()}"
            th:required="${selectedTargetDef != null && selectedTargetDef.requiresParam && !selectedTargetDef.allowedParams.isEmpty()}"
          >
            <option value="">-- Valor --</option>
            <option
              th:each="p : ${selectedTargetDef.allowedParams}"
              th:value="${p}"
              th:text="${p}"
              th:selected="${rule != null && rule.targetParam == p}"
            ></option>
          </select>
          <!-- Number input for free-param or fallback -->
          <input
            th:id="|target-param-input-${index}|"
            type="number"
            step="0.01"
            class="form-control form-control-sm"
            th:name="|rules[${index}].targetParam|"
            th:value="${rule != null ? rule.targetParam : ''}"
            placeholder="0.00"
            th:if="${selectedTargetDef == null || !selectedTargetDef.requiresParam || selectedTargetDef.allowedParams.isEmpty()}"
            th:required="${selectedTargetDef != null && selectedTargetDef.requiresParam && selectedTargetDef.allowedParams.isEmpty()}"
          />
        </label>
      </div>

      <!-- Remove Button -->
      <div class="col-md-1 text-end">
        <!-- Remove Button -->
        <div class="col-md-1 text-end">
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            onclick="removeRuleRow(this)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
