<!-- templates/fragments/rule-row.html -->
<div th:fragment="ruleRow" class="rule-row card mb-2">
  <div class="card-body">
    <div class="row g-1 align-items-end">
      <!-- Rule Name -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          Nombre de la Regla
          <input
            type="text"
            class="form-control form-control-sm"
            th:name="|rules[${index}].name|"
            th:value="${rule != null ? rule.name : ''}"
            placeholder="Nombre de la Regla"
            required
          />
        </label>
      </div>

      <!-- Subject Indicator -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          Indicador de Sujeto
          <select
            class="form-select form-select-sm"
            th:name="|rules[${index}].subjectCode|"
            th:onchange="|toggleSubjectParameter(this, ${index})|"
            required
          >
            <option value="" data-requires-param="false" data-any-param="false">
              -- Seleccionar Indicador --
            </option>
            <option
              th:each="rd : ${ruleDefinitions}"
              th:value="${rd.code}"
              th:text="${rd.name}"
              th:attr="data-requires-param=${rd.requiresParam},data-any-param=${rd.anyParamAllowed}"
              th:selected="${rule != null && rule.subjectCode == rd.code}"
            ></option>
          </select>
        </label>
      </div>

      <div
        th:replace="~{fragments/rule-parameter-field :: parameterField(containerId=|subject-container-${index}|, selectId=|subject-param-select-${index}|, inputId=|subject-param-input-${index}|, fieldName=|rules[${index}].subjectParam|, label='Parámetro de Sujeto', value=${rule != null ? rule.subjectParam : ''})}"
      ></div>

      <!-- Operator -->
      <div class="col-md-1">
        <label class="form-label small text-muted">
          Operador
          <select
            class="form-select form-select-sm"
            th:name="|rules[${index}].operator|"
          >
            <option
              value=">"
              th:selected="${rule != null && rule.operator == '>'}"
            >
              >&gt;
            </option>
            <option
              value="<"
              th:selected="${rule != null && rule.operator == '<'}"
            >
              &lt;
            </option>
            <option
              value="="
              th:selected="${rule != null && rule.operator == '='}"
            >
              >=
            </option>
          </select>
        </label>
      </div>

      <!-- Target Indicator -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          Indicador de Objetivo
          <select
            class="form-select form-select-sm"
            th:name="|rules[${index}].targetCode|"
            th:onchange="|toggleTargetParameter(this, ${index})|"
            required
          >
            <option value="" data-requires-param="false" data-any-param="false">
              -- Seleccionar Indicador --
            </option>
            <option
              th:each="rd : ${ruleDefinitions}"
              th:value="${rd.code}"
              th:text="${rd.name}"
              th:attr="data-requires-param=${rd.requiresParam},data-any-param=${rd.anyParamAllowed}"
              th:selected="${rule != null && rule.targetCode == rd.code}"
            ></option>
          </select>
        </label>
      </div>

      <div
        th:replace="~{fragments/rule-parameter-field :: parameterField(containerId=|target-container-${index}|, selectId=|target-param-select-${index}|, inputId=|target-param-input-${index}|, fieldName=|rules[${index}].targetParam|, label='Valor de Objetivo', value=${rule != null ? rule.targetParam : ''})}"
      ></div>

      <!-- Remove Button -->
      <div class="col-md-1 text-end">
        <!-- Remove Button -->
        <div class="col-md-1 text-end">
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            onclick="removeRuleRow(this)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
