<!-- templates/fragments/rule-row.html
     Fragment para una fila de regla condicional en la estrategia.
     Parámetros esperados:
       - index: número de fila (0-based) para naming único de campos (rules[0].subjectCode, etc.)
       - rule: objeto Rule opcional con valores actuales (null = nueva fila)
       - ruleDefinitions: lista de definiciones para poblar selects de indicadores
     Genera: fila con subject/target/operator/parameter + botón eliminar.
     JS: addRuleRow()/removeRuleRow() en strategy-manager.js manejan índices dinámicos. -->
<div
  th:fragment="ruleRow(index, rule, ruleDefinitions)"
  class="rule-row card mb-2"
>
  <div class="card-body">
    <div class="row g-1 align-items-end">
      <!-- Rule Name -->
      <div class="col-md-2">
        <label class="form-label small text-muted">
          <span th:text="#{rule.name}">Nombre de la Regla</span>
          <input
            type="text"
            class="form-control form-control-sm"
            th:name="|rules[${index}].name|"
            th:value="${rule != null ? rule.name : ''}"
            th:placeholder="#{rule.name}"
            required
          />
        </label>
      </div>

      <!-- Subject Indicator -->
      <div
        th:replace="~{fragments/rule-indicator-field :: indicatorField(fieldName=|rules[${index}].subjectCode|, label='Indicador de Sujeto', onchangeFunction=|toggleSubjectParameter(this, ${index})|, index=${index}, value=${rule != null ? rule.subjectCode : ''}, ruleDefinitions=${ruleDefinitions})}"
      ></div>

      <!-- Subject Parameter -->
      <div
        th:replace="~{fragments/rule-parameter-field :: parameterField(containerId=|subject-container-${index}|, selectId=|subject-param-select-${index}|, inputId=|subject-param-input-${index}|, fieldName=|rules[${index}].subjectParam|, label='Parámetro de Sujeto', value=${rule != null ? rule.subjectParam : ''})}"
      ></div>

      <!-- Operator -->
      <div
        th:replace="~{fragments/rule-operator-field :: operatorField(fieldName=|rules[${index}].operator|, value=${rule != null ? rule.operator : ''})}"
      ></div>

      <!-- Target Indicator -->
      <div
        th:replace="~{fragments/rule-indicator-field :: indicatorField(fieldName=|rules[${index}].targetCode|, label='Indicador de Objetivo', onchangeFunction=|toggleTargetParameter(this, ${index})|, index=${index}, value=${rule != null ? rule.targetCode : ''}, ruleDefinitions=${ruleDefinitions})}"
      ></div>

      <!-- Target Parameter -->
      <div
        th:replace="~{fragments/rule-parameter-field :: parameterField(containerId=|target-container-${index}|, selectId=|target-param-select-${index}|, inputId=|target-param-input-${index}|, fieldName=|rules[${index}].targetParam|, label='Valor de Objetivo', value=${rule != null ? rule.targetParam : ''})}"
      ></div>

      <!-- Remove Button -->
      <div class="col-md-1 text-end">
        <button
          type="button"
          class="btn btn-sm btn-outline-danger"
          data-action="remove-rule"
        >
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <div class="row g-1 align-items-end mt-1">
      <!-- Rule Weight -->
      <div class="col-md-3">
        <label class="form-label small text-muted">
          <span th:text="#{rule.weight}">Peso de la Regla</span>
          <input
            type="number"
            class="form-control form-control-sm"
            th:name="|rules[${index}].weight|"
            th:value="${rule != null and rule.weight != null ? rule.weight : 1}"
            min="1"
            step="1"
            required
          />
        </label>
      </div>
    </div>
  </div>
</div>
