<div
  th:fragment="aiValoration(sections)"
  class="card border-0 shadow-sm mb-5"
  th:if="${sections != null}"
>
  <div
    class="card-header bg-white border-0 py-3 d-flex align-items-center gap-2"
  >
    <i class="bi bi-stars text-info"></i>
    <h6 class="mb-0 fw-bold" th:text="#{ai.title}">Análisis técnico</h6>
  </div>
  <div
    class="card-body bg-light bg-opacity-50 p-4"
  >
    <div class="alert alert-warning mb-0 d-flex align-items-center gap-2" th:unless="${sections.structured}">
      <i class="bi bi-exclamation-triangle"></i>
      <span th:text="${sections.raw} ?: #{ticker.ia.fallback}">Mensaje no disponible</span>
    </div>
    <div class="row g-3" th:if="${sections.structured}">
      <div class="col-md-6">
        <div class="p-3 bg-white rounded-3 border h-100">
          <h6 class="text-primary text-uppercase fw-bold mb-2" th:text="#{ai.summary}">
            Resumen técnico
          </h6>
          <p class="mb-0 lh-lg text-muted" th:text="${sections.resumen}">Resumen</p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 bg-white rounded-3 border h-100">
          <h6 class="text-success text-uppercase fw-bold mb-2" th:text="#{ai.strengths}">Fortalezas</h6>
          <p class="mb-0 lh-lg text-muted" th:text="${sections.fortalezas}">
            Fortalezas
          </p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 bg-white rounded-3 border h-100">
          <h6 class="text-danger text-uppercase fw-bold mb-2" th:text="#{ai.risks}">Riesgos</h6>
          <p class="mb-0 lh-lg text-muted" th:text="${sections.riesgos}">Riesgos</p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 bg-white rounded-3 border h-100">
          <h6 class="text-info text-uppercase fw-bold mb-2" th:text="#{ai.conclusion}">
            Conclusión interpretativa
          </h6>
          <p class="mb-0 lh-lg text-muted" th:text="${sections.conclusion}">
            Conclusión
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
