<!-- templates/fragments/risk-management-fields.html
     Fragment con los campos de gestión de riesgo de una estrategia.
     Sin parámetros (usa th:object del form padre para binding).
     Campos:
        - objectiveTargetType: SELECT (SMA/PERCENTAGE/FIXED_PRICE) → afecta campos visibles
        - objectiveTargetValue / objectiveTargetSmaSelect: input o select según targetType
        - objectiveStopLossType: SELECT (SMA/PERCENTAGE/FIXED_PRICE) → afecta campos visibles
        - objectiveStopLossValue / objectiveStopLossSmaSelect: input o select según stopLossType
        - objectiveCapitalToRisk: % capital máximo por trade
        - objectiveDescription: descripción del objetivo
      JS: risk-management.js maneja show/hide según selects. Las etiquetas y
      textos SMA se resuelven vía atributos data-* (i18n en messages.properties).
      Uso: strategies/create.html via th:replace. -->
<div th:fragment="riskManagementFields" class="row g-3">
  <!-- Target Type -->
  <div class="col-md-3">
    <label for="objectiveTargetType" class="form-label fw-semibold"
      ><span th:text="#{risk.target_type}">Tipo de Objetivo</span></label
    >
    <select
      class="form-select"
      id="objectiveTargetType"
      name="objective.targetType"
      required
      th:data-label-default="#{risk.target_value}"
      th:data-label-percentage="#{risk.target_value.percentage}"
      th:data-label-fixed="#{risk.target_value.fixed}"
      th:data-label-sma="#{risk.target_value.sma}"
      th:data-placeholder-default="'ej., 5.00'"
      th:data-placeholder-percentage="'ej., 5.00 (%)'"
      th:data-placeholder-fixed="'ej., 150.00 ($)'"
    >
      <option
        value=""
        th:selected="${strategy.objective == null or strategy.objective.targetType == null}"
        th:text="#{risk.select_type}"
      >
        Selecciona tipo...
      </option>
      <option
        value="SMA"
        th:selected="${strategy.objective != null and strategy.objective.targetType == 'SMA'}"
      >
        SMA
      </option>
      <option
        value="PERCENTAGE"
        th:selected="${strategy.objective != null and strategy.objective.targetType == 'PERCENTAGE'}"
      >
        PERCENTAGE
      </option>
      <option
        value="FIXED_PRICE"
        th:selected="${strategy.objective != null and strategy.objective.targetType == 'FIXED_PRICE'}"
      >
        FIXED_PRICE
      </option>
    </select>
  </div>

  <!-- Target Value -->
  <div class="col-md-3">
    <label for="objectiveTargetValue" class="form-label fw-semibold"
      ><span id="objectiveTargetValueLabel" th:text="#{risk.target_value}">Valor Objetivo</span>
      <i
        id="objectiveTargetSmaHelp"
        class="bi bi-info-circle text-muted ms-1 d-none"
        data-bs-toggle="tooltip"
        th:title="#{risk.sma.help}"
        aria-hidden="true"
      ></i
    ></label>
    <select
      class="form-select d-none"
      id="objectiveTargetSmaSelect"
      aria-labelledby="objectiveTargetValueLabel"
      disabled
      th:data-default-option="#{risk.sma.period}"
      th:data-short="#{risk.sma.short}"
      th:data-medium="#{risk.sma.medium}"
      th:data-long="#{risk.sma.long}"
    >
      <option value="" th:text="#{risk.sma.period}">-- Periodo SMA --</option>
    </select>
    <input
      type="number"
      class="form-control"
      id="objectiveTargetValue"
      name="objective.targetValue"
      th:value="${strategy.objective != null ? strategy.objective.targetValue : ''}"
      placeholder="ej., 5.00"
      step="0.0001"
      min="0"
      required
    />
  </div>

  <!-- Stop-Loss Type -->
  <div class="col-md-3">
    <label for="objectiveStopLossType" class="form-label fw-semibold"
      ><span th:text="#{risk.stop_loss_type}">Tipo de Stop Loss</span></label
    >
    <select
      class="form-select"
      id="objectiveStopLossType"
      name="objective.stopLossType"
      required
      th:data-label-default="#{risk.stop_loss_value}"
      th:data-label-percentage="#{risk.stop_value.percentage}"
      th:data-label-fixed="#{risk.stop_value.fixed}"
      th:data-label-sma="#{risk.stop_value.sma}"
      th:data-placeholder-default="'ej., 2.00'"
      th:data-placeholder-percentage="'ej., 2.00 (%)'"
      th:data-placeholder-fixed="'ej., 150.00 ($)'"
    >
      <option
        value=""
        th:selected="${strategy.objective == null or strategy.objective.stopLossType == null}"
        th:text="#{risk.select_type}"
      >
        Selecciona tipo...
      </option>
      <option
        value="SMA"
        th:selected="${strategy.objective != null and strategy.objective.stopLossType == 'SMA'}"
      >
        SMA
      </option>
      <option
        value="PERCENTAGE"
        th:selected="${strategy.objective != null and strategy.objective.stopLossType == 'PERCENTAGE'}"
      >
        PERCENTAGE
      </option>
      <option
        value="FIXED_PRICE"
        th:selected="${strategy.objective != null and strategy.objective.stopLossType == 'FIXED_PRICE'}"
      >
        FIXED_PRICE
      </option>
    </select>
  </div>

  <!-- Stop-Loss Value -->
  <div class="col-md-3">
    <label for="objectiveStopLossValue" class="form-label fw-semibold"
      ><span id="objectiveStopLossValueLabel" th:text="#{risk.stop_loss_value}">Valor Stop Loss</span>
      <i
        id="objectiveStopLossSmaHelp"
        class="bi bi-info-circle text-muted ms-1 d-none"
        data-bs-toggle="tooltip"
        th:title="#{risk.sma.help}"
        aria-hidden="true"
      ></i
    ></label>
    <select
      class="form-select d-none"
      id="objectiveStopLossSmaSelect"
      aria-labelledby="objectiveStopLossValueLabel"
      disabled
      th:data-default-option="#{risk.sma.period}"
      th:data-short="#{risk.sma.short}"
      th:data-medium="#{risk.sma.medium}"
      th:data-long="#{risk.sma.long}"
    >
      <option value="" th:text="#{risk.sma.period}">-- Periodo SMA --</option>
    </select>
    <input
      type="number"
      class="form-control"
      id="objectiveStopLossValue"
      name="objective.stopLossValue"
      th:value="${strategy.objective != null ? strategy.objective.stopLossValue : ''}"
      placeholder="ej., 2.00"
      step="0.0001"
      min="0"
      required
    />
  </div>

  <!-- Capital to Risk -->
  <div class="col-md-4">
    <label for="objectiveCapitalToRisk" class="form-label fw-semibold"
      ><span th:text="#{risk.capital_to_risk}">Capital a Arriesgar</span></label
    >
    <input
      type="number"
      class="form-control"
      id="objectiveCapitalToRisk"
      name="objective.capitalToRisk"
      th:value="${strategy.objective != null ? strategy.objective.capitalToRisk : ''}"
      placeholder="ej., 1000.00"
      step="0.0001"
      min="0"
      required
    />
  </div>

  <!-- Objective Description -->
  <div class="col-md-12">
    <label for="objectiveDescription" class="form-label fw-semibold"
      ><span th:text="#{risk.description}">Descripción del Objetivo</span></label
    >
    <input
      type="text"
      class="form-control"
      id="objectiveDescription"
      name="objective.description"
      th:value="${strategy.objective != null ? strategy.objective.description : ''}"
      th:placeholder="#{risk.description.placeholder}"
      required
    />
  </div>
</div>
