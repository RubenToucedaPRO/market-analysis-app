<!-- templates/fragments/navbar.html -->
<nav
  th:fragment="navbar"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top"
>
  <div class="container-fluid">
    <!-- Logo and Title -->
    <a
      class="navbar-brand d-flex align-items-center gap-2"
      th:href="@{/analysis}"
    >
      <i class="bi bi-graph-up-arrow text-primary"></i>
      <span class="fw-bold text-primary">AlphaSeeker</span>
    </a>

    <!-- Mobile Toggle Button -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/analysis}"
            ><i class="bi bi-graph-up me-1"></i>Análisis</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/strategies}"
            ><i class="bi bi-list me-1"></i>Estrategias</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/rule-definitions}">
            <i class="bi bi-collection me-1"></i>Definiciones de Reglas</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/prohibited-tickers}"
            ><i class="bi bi-shield-x me-1"></i>Tickers Prohibidos</a
          >
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link btn btn-link">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>
