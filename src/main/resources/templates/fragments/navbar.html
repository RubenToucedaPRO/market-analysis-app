<!-- fragments/navbar.html -->
<nav
  th:fragment="navbar(isAuthenticated)"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top"
>
  <div class="container-fluid">
    <a
      class="navbar-brand d-flex align-items-center gap-2"
      th:href="${isAuthenticated ? @{/analysis} : @{/}}"
    >
      <i class="bi bi-graph-up-arrow text-primary"></i>
      <span class="fw-bold text-primary">AlphaSeeker</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/analysis}"
            ><i class="bi bi-graph-up me-1"></i><span th:text="#{nav.analysis}">Análisis</span></a
          >
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/strategies}"
            ><i class="bi bi-list me-1"></i><span th:text="#{nav.strategies}">Estrategias</span></a
          >
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/rule-definitions}">
            <i class="bi bi-collection me-1"></i><span th:text="#{nav.rule_definitions}">Definiciones de Reglas</span></a
          >
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <a class="nav-link" th:href="@{/prohibited-tickers}"
            ><i class="bi bi-shield-x me-1"></i><span th:text="#{nav.prohibited_tickers}">Tickers Prohibidos</span></a
          >
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="nav-link btn btn-link">
              <i class="bi bi-box-arrow-right me-1"></i><span th:text="#{nav.logout}">Salir</span>
            </button>
          </form>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
          <a class="btn btn-primary px-4" th:href="@{/login}">
            <i class="bi bi-box-arrow-in-right me-1"></i><span th:text="#{nav.login}">Acceder</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
