<div
  th:fragment="message"
  th:if="${message}"
  th:classappend="'alert-' + ${messageType}"
  class="alert alert-dismissible fade show"
  role="alert"
>
  <i
    th:class="${messageType == 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'}"
    class="bi me-2"
  ></i>

  <span th:text="${message}"></span>

  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="alert"
    aria-label="Cerrar"
  ></button>
</div>
