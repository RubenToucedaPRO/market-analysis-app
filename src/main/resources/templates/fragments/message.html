<!-- Error Alert -->
<div
  th:fragment="message"
  th:if="${errorMessage}"
  class="alert alert-danger alert-dismissible fade show"
  role="alert"
>
  <i class="bi bi-exclamation-triangle-fill me-2"></i>
  <span th:text="${errorMessage}"></span>
  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="alert"
    aria-label="Cerrar"
  ></button>
</div>
