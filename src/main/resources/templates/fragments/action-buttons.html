<!-- fragments/action-buttons.html -->
<th:block th:fragment="editDelete(editHref, deleteAction, deleteId, deleteMessage)">
  <div class="d-flex gap-2">
    <a th:href="${editHref}" class="btn btn-outline-primary btn-sm flex-fill">
      <i class="bi bi-pencil-square me-1"></i> Editar
    </a>
    <form th:action="${deleteAction}" method="post" class="flex-fill">
      <input type="hidden" name="id" th:value="${deleteId}" />
      <button
        type="submit"
        class="btn btn-outline-danger btn-sm w-100"
        th:onclick="'return confirm(\'' + ${deleteMessage} + '\')'"
      >
        <i class="bi bi-trash me-1"></i> Eliminar
      </button>
    </form>
  </div>
</th:block>
