<!--
  Fragment de trazabilidad: muestra qué tickers cumplen/no cumplen la estrategia.
  Parámetros esperados:
    - strategyId: Long ID de la estrategia
    - suggestedTickers: List<TickerSuggestionDTO> que PASAN la evaluación
    - discardedTickers: List<TickerSuggestionDTO> que FALLAN la evaluación
    - unmappableRules: List<String> códigos de regla no mapeables a Finviz
    - suggestedAt: Instant timestamp de la sugerencia
  Condición de render: th:if con ANY no-null (para no mostrar tarjeta vacía).
  Uso: strategies/detail.html th:replace con datos del servicio SuggestTickersService.
-->
<div
  th:fragment="strategyTraceability(strategyId, suggestedTickers, discardedTickers, unmappableRules, suggestedAt)"
  class="card mt-4"
  th:if="${suggestedAt != null or suggestedTickers != null or discardedTickers != null or unmappableRules != null}"
>
  <div class="card-header bg-light">
    <h6 class="mb-0">
      <i class="bi bi-diagram-3 me-2 text-primary"></i>
      <span th:text="#{traceability.title}">Trazabilidad de sugerencias</span>
    </h6>
      <p class="text-muted small mb-0 mt-1" th:if="${suggestedAt != null}">
      <span th:text="#{traceability.last_suggestion}">Última sugerencia:</span> <span th:text="${suggestedAt}">2026-04-18T12:00:00Z</span>
    </p>
  </div>
  <div class="card-body">
    <div class="mb-3">
      <p class="form-label fw-semibold small text-muted mb-1" th:text="#{traceability.suggested}">Sugeridos</p>
      <div
        id="suggested-tickers-traceability"
        th:if="${suggestedTickers != null and !suggestedTickers.isEmpty()}"
        class="d-flex flex-wrap gap-2"
      >
        <span
          class="badge text-bg-success me-1"
          th:each="item : ${suggestedTickers}"
          th:text="${item.ticker}"
          >AAPL</span
        >
      </div>
      <form
        th:if="${suggestedTickers != null and !suggestedTickers.isEmpty()}"
        th:action="@{/strategies/{id}/add-suggested-tickers(id=${strategyId})}"
        method="post"
        class="mt-2"
      >
        <button
          type="submit"
          class="btn btn-sm btn-outline-primary"
          aria-label="#{traceability.add_suggested.aria}"
        >
          <i class="bi bi-plus-circle me-1"></i>
          <span th:text="#{traceability.add_suggested}">Añadir sugeridos a análisis</span>
        </button>
      </form>
      <p
        class="text-muted small mb-0"
        th:if="${suggestedTickers == null or suggestedTickers.isEmpty()}"
        th:text="#{traceability.no_suggested}">Sin sugerencias aptas.
      </p>
    </div>

    <div class="mb-3">
      <p class="form-label fw-semibold small text-muted mb-1" th:text="#{traceability.discarded}">Descartes</p>
      <div
        id="discarded-tickers-traceability"
        th:if="${discardedTickers != null and !discardedTickers.isEmpty()}"
      >
        <span
          class="badge text-bg-secondary me-1"
          th:each="item : ${discardedTickers}"
          th:text="${item.ticker}"
          >TSLA</span
        >
      </div>
      <p
        class="text-muted small mb-0"
        th:if="${discardedTickers == null or discardedTickers.isEmpty()}"
        th:text="#{traceability.no_discarded}">Sin descartes.
      </p>
    </div>

    <div>
      <p class="form-label fw-semibold small text-muted mb-1" th:text="#{traceability.unmappable_rules}">
        Reglas no mapeables
      </p>
      <ul
        id="unmappable-rules-traceability"
        class="mb-0"
        th:if="${unmappableRules != null and !unmappableRules.isEmpty()}"
      >
        <li th:each="rule : ${unmappableRules}" th:text="${rule}">ATR(14)</li>
      </ul>
      <p
        class="text-muted small mb-0"
        th:if="${unmappableRules == null or unmappableRules.isEmpty()}"
        th:text="#{traceability.no_unmappable}">Sin reglas no mapeables.
      </p>
    </div>
  </div>
</div>
