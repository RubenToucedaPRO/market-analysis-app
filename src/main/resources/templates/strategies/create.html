<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head(${isEdit} ? #{strategy.form.edit} + ' - AlphaSeeker' : #{strategy.form.create} + ' - AlphaSeeker')}"></head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar(isAuthenticated=${true})}"></div>
    <div th:replace="~{fragments/notification :: notification}"></div>

    <main class="container my-5 flex-grow-1">
      <div
        class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-1"
      >
        <div>
          <h2
            th:text="${isEdit} ? #{strategy.form.edit} : #{strategy.form.create}"
          >
            Crear Nueva Estrategia
          </h2>
        </div>
        <div class="mb-4 d-flex justify-content-end gap-2">
          <button type="submit" form="strategyForm" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>
            <span th:text="#{strategy.form.save}">Guardar Estrategia</span>
          </button>
        </div>
      </div>
      <div class="mb-4">
        <form
          id="strategyForm"
          th:action="@{/strategies}"
          th:object="${strategy}"
          method="post"
        >
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-gear text-primary me-2"></i>
                <span th:text="#{strategy.form.details}">Detalles de la Estrategia</span>
              </h5>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <input type="hidden" th:field="*{id}" />
                <div class="col-md-6">
                  <label for="strategyName" class="form-label fw-semibold"
                    th:text="#{strategy.form.name}">Nombre de la Estrategia</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="strategyName"
                    th:field="*{name}"
                    placeholder="ej., RSI Oversold Recovery"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label
                    for="strategyDescription"
                    class="form-label fw-semibold"
                    th:text="#{strategy.form.description}">Descripción</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="strategyDescription"
                    th:field="*{description}"
                    placeholder="Describe la lógica de tu estrategia..."
                    required
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-shield-check text-primary me-2"></i>
                <span th:text="#{strategy.form.risk_management}">Gestión de Riesgo</span>
              </h5>
            </div>
            <div class="card-body">
              <div
                th:replace="~{fragments/risk-management-fields :: riskManagementFields}"
              ></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-list-check text-primary me-2"></i>
                <span th:text="#{strategy.form.execution_rules}">Reglas de Ejecución</span>
              </h5>
            </div>
            <div class="card-body">
              <div id="rules-container">
                <th:block th:each="rule, stat : *{rules}">
                  <div
                    th:replace="~{fragments/rule-row :: ruleRow(index=${stat.index}, rule=${rule}, ruleDefinitions=${ruleDefinitions})}"
                  ></div>
                </th:block>
              </div>
            </div>

            <button
              type="button"
              class="btn btn-outline-primary w-100"
              onclick="addRuleRow()"
            >
              <i class="bi bi-plus-circle me-1"></i>
              <span th:text="#{strategy.form.add_rule}">Añadir Regla Condicional</span>
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <template id="rule-template">
      <div
        th:replace="~{fragments/rule-row :: ruleRow(index=999, rule=${null}, ruleDefinitions=${ruleDefinitions})}"
      ></div>
    </template>

    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

    <script th:inline="javascript">
      globalThis.ruleDefinitions = /*[[${ruleDefinitions}]]*/ [];
    </script>

    <script th:src="@{/js/strategy-manager.js}"></script>
    <script th:src="@{/js/risk-management.js}"></script>
  </body>
</html>
