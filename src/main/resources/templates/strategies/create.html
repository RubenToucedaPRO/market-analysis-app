<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${isEdit} ? 'Editar Estrategia' : 'Crear Estrategia'">
      Create Strategy - AlphaSeeker
    </title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
    <!-- Message Alert -->
    <div th:replace="~{fragments/notification :: notification}"></div>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="container my-5 flex-grow-1">
      <!-- Message Alert -->
      <div th:replace="~{fragments/notification :: notification}"></div>

      <div
        class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-1"
      >
        <div>
          <h2
            th:text="${isEdit} ? 'Editar Estrategia' : 'Crear Nueva Estrategia'"
          >
            Crear Nueva Estrategia
          </h2>
        </div>
        <div class="mb-4 d-flex justify-content-end gap-2">
          <button type="submit" form="strategyForm" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>
            Guardar Estrategia
          </button>
        </div>
      </div>
      <div class="mb-4">
        <form
          id="strategyForm"
          th:action="@{/strategies}"
          th:object="${strategy}"
          method="post"
        >
          <!-- Strategy Details Card -->
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-gear text-primary me-2"></i>
                Detalles de la Estrategia
              </h5>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <input type="hidden" th:field="*{id}" />
                <!-- Strategy Name -->
                <div class="col-md-6">
                  <label for="strategyName" class="form-label fw-semibold"
                    >Nombre de la Estrategia</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="strategyName"
                    th:field="*{name}"
                    placeholder="ej., RSI Oversold Recovery"
                    required
                  />
                </div>

                <!-- Description -->
                <div class="col-md-6">
                  <label
                    for="strategyDescription"
                    class="form-label fw-semibold"
                    >Descripción</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="strategyDescription"
                    th:field="*{description}"
                    placeholder="Describe la lógica de tu estrategia..."
                    required
                  />
                </div>
              </div>
            </div>
          </div>

          <!-- Risk Management Card -->
          <div class="card mb-4">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-shield-check text-primary me-2"></i>
                Gestión de Riesgo
              </h5>
            </div>
            <div class="card-body">
              <div class="row g-3">
                <!-- Target Type -->
                <div class="col-md-4">
                  <label
                    for="objectiveTargetType"
                    class="form-label fw-semibold"
                    >Tipo de Objetivo</label
                  >
                  <select
                    class="form-select"
                    id="objectiveTargetType"
                    name="objective.targetType"
                    required
                  >
                    <option
                      value=""
                      th:selected="${strategy.objective == null or strategy.objective.targetType == null}"
                    >
                      Selecciona tipo...
                    </option>
                    <option
                      value="SMA"
                      th:selected="${strategy.objective != null and strategy.objective.targetType == 'SMA'}"
                    >
                      SMA
                    </option>
                    <option
                      value="PERCENTAGE"
                      th:selected="${strategy.objective != null and strategy.objective.targetType == 'PERCENTAGE'}"
                    >
                      PERCENTAGE
                    </option>
                    <option
                      value="FIXED_PRICE"
                      th:selected="${strategy.objective != null and strategy.objective.targetType == 'FIXED_PRICE'}"
                    >
                      FIXED_PRICE
                    </option>
                  </select>
                </div>

                <!-- Target Value -->
                <div class="col-md-4">
                  <label
                    for="objectiveTargetValue"
                    class="form-label fw-semibold"
                    >Valor Objetivo</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="objectiveTargetValue"
                    name="objective.targetValue"
                    th:value="${strategy.objective != null ? strategy.objective.targetValue : ''}"
                    placeholder="ej., 5.00"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>

                <!-- Stop-Loss Type -->
                <div class="col-md-4">
                  <label
                    for="objectiveStopLossType"
                    class="form-label fw-semibold"
                    >Tipo de Stop Loss</label
                  >
                  <select
                    class="form-select"
                    id="objectiveStopLossType"
                    name="objective.stopLossType"
                    required
                  >
                    <option
                      value=""
                      th:selected="${strategy.objective == null or strategy.objective.stopLossType == null}"
                    >
                      Selecciona tipo...
                    </option>
                    <option
                      value="SMA"
                      th:selected="${strategy.objective != null and strategy.objective.stopLossType == 'SMA'}"
                    >
                      SMA
                    </option>
                    <option
                      value="PERCENTAGE"
                      th:selected="${strategy.objective != null and strategy.objective.stopLossType == 'PERCENTAGE'}"
                    >
                      PERCENTAGE
                    </option>
                    <option
                      value="FIXED_PRICE"
                      th:selected="${strategy.objective != null and strategy.objective.stopLossType == 'FIXED_PRICE'}"
                    >
                      FIXED_PRICE
                    </option>
                  </select>
                </div>

                <!-- Stop-Loss Value -->
                <div class="col-md-4">
                  <label
                    for="objectiveStopLossValue"
                    class="form-label fw-semibold"
                    >Valor Stop Loss</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="objectiveStopLossValue"
                    name="objective.stopLossValue"
                    th:value="${strategy.objective != null ? strategy.objective.stopLossValue : ''}"
                    placeholder="ej., 2.00"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>

                <!-- Capital to Risk -->
                <div class="col-md-4">
                  <label
                    for="objectiveCapitalToRisk"
                    class="form-label fw-semibold"
                    >Capital a Arriesgar</label
                  >
                  <input
                    type="number"
                    class="form-control"
                    id="objectiveCapitalToRisk"
                    name="objective.capitalToRisk"
                    th:value="${strategy.objective != null ? strategy.objective.capitalToRisk : ''}"
                    placeholder="ej., 1000.00"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>

                <!-- Objective Description -->
                <div class="col-md-12">
                  <label
                    for="objectiveDescription"
                    class="form-label fw-semibold"
                    >Descripción del Objetivo</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="objectiveDescription"
                    name="objective.description"
                    th:value="${strategy.objective != null ? strategy.objective.description : ''}"
                    placeholder="Describe los objetivos de riesgo de tu estrategia..."
                    required
                  />
                </div>
              </div>
            </div>
          </div>

          <!-- Execution Rules Card -->
          <div class="card">
            <div class="card-header bg-light">
              <h5 class="mb-0">
                <i class="bi bi-list-check text-primary me-2"></i>
                Reglas de Ejecución
              </h5>
            </div>
            <div class="card-body">
              <div id="rules-container">
                <!-- Existing rules will be rendered here -->
                <th:block th:each="rule, stat : *{rules}">
                  <div
                    th:replace="~{fragments/rule-row :: ruleRow(index=${stat.index}, rule=${rule})}"
                  ></div>
                </th:block>
              </div>
            </div>

            <!-- Add Rule Button -->
            <button
              type="button"
              class="btn btn-outline-primary w-100"
              onclick="addRuleRow()"
            >
              <i class="bi bi-plus-circle me-1"></i>
              Añadir Regla Condicional
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted">
          &copy; 2026 AlphaSeeker. Todos los derechos reservados.
        </small>
      </div>
    </footer>

    <template id="rule-template">
      <div
        th:replace="~{fragments/rule-row :: ruleRow(index=999, rule=${null})}"
      ></div>
    </template>

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Pass rule definitions to JavaScript -->
    <script th:inline="javascript">
      globalThis.ruleDefinitions = /*[[${ruleDefinitions}]]*/ [];
    </script>

    <!-- Custom JavaScript -->
    <script th:src="@{/js/strategy-manager.js}"></script>
  </body>
</html>
