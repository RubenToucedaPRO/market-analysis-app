<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Estrategias - AlphaSeeker</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/strategy-common.css}" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="container my-5 flex-grow-1">
      <h2 class="mb-4">Tus Estrategias de Trading</h2>

      <div
        th:if="${!strategies.isEmpty()}"
        class="d-flex justify-content-end mb-3"
      >
        <a th:href="@{/strategies/new}" class="btn btn-primary">
          <i class="bi bi-plus-circle me-1"></i>
          Nueva Estrategia
        </a>
      </div>

      <!-- Empty State -->
      <div th:if="${strategies.isEmpty()}" class="text-center py-5">
        <i class="bi bi-search text-muted" style="font-size: 4rem"></i>
        <p class="text-muted fs-5 mt-3">
          No se encontraron estrategias. ¡Vamos a crear una!
        </p>
        <a th:href="@{/strategies/new}" class="btn btn-primary mt-3">
          <i class="bi bi-plus me-1"></i>
          Crear Estrategia
        </a>
      </div>

      <!-- Strategies Table -->
      <div th:unless="${strategies.isEmpty()}" class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Nombre</th>
                  <th scope="col">Descripción</th>
                  <th scope="col">Reglas</th>
                  <th scope="col" class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="strategy : ${strategies}">
                  <td class="fw-semibold">
                    <a
                      th:href="@{/strategies/{id}(id=${strategy.id})}"
                      th:text="${strategy.name}"
                      class="d-block w-100 h-100 text-decoration-none"
                    >
                      Golden Cross
                    </a>
                  </td>
                  <td class="text-muted" th:text="${strategy.description}">
                    Description of the strategy.
                  </td>
                  <td th:text="${strategy.rules.size()} + ' reglas'">3 reglas</td>
                  <td class="text-end">
                    <form
                      th:action="@{/strategies/edit}"
                      method="post"
                      style="display: inline"
                    >
                      <input
                        type="hidden"
                        name="id"
                        th:value="${strategy.id}"
                      />
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-primary me-2"
                      >
                        <i class="bi bi-pencil"></i>
                        Editar
                      </button>
                    </form>
                    <form
                      th:action="@{/strategies/delete}"
                      method="post"
                      style="display: inline"
                    >
                      <input
                        type="hidden"
                        name="id"
                        th:value="${strategy.id}"
                      />
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                        onclick="
                          return confirm(
                            '¿Estás seguro de borrar esta estrategia?',
                          );
                        "
                      >
                        <i class="bi bi-trash"></i> Eliminar
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted"
          >&copy; 2023 AlphaSeeker. Todos los derechos reservados.</small
        >
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
