<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Iniciar Sesión - AlphaSeeker')}">
    <title>Iniciar Sesión - AlphaSeeker</title>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <div th:replace="~{fragments/navbar :: navbar(isAuthenticated=${false})}"></div>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
      <div class="row w-100 justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <div class="home-feature-icon bg-primary bg-opacity-10 text-primary mx-auto mb-3">
                  <i class="bi bi-person-circle"></i>
                </div>
                <h3 class="fw-bold text-dark" th:text="#{login.title}">Iniciar Sesión</h3>
              </div>

              <div
                th:if="${param.error}"
                class="alert alert-danger d-flex align-items-center"
                role="alert"
              >
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="#{login.error}">Usuario o contraseña incorrectos.</span>
              </div>

              <div
                th:if="${param.logout}"
                class="alert alert-success d-flex align-items-center"
                role="alert"
              >
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="#{login.logout}">Sesión cerrada correctamente.</span>
              </div>

              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label for="username" class="form-label fw-semibold" th:text="#{login.username}">Usuario</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">
                      <i class="bi bi-person text-muted"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control"
                      id="username"
                      name="username"
                      required
                      autofocus
                      placeholder="admin"
                    />
                  </div>
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold" th:text="#{login.password}">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">
                      <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      required
                      placeholder="admin"
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold"
                  th:text="#{login.submit}"
                >
                  Iniciar Sesión
                </button>
              </form>

              <div class="text-center mt-4">
                <a th:href="@{/}" class="text-muted text-decoration-none">
                  <i class="bi bi-arrow-left me-1"></i>
                  <span th:text="#{login.back}">Volver al inicio</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
  </body>
</html>
