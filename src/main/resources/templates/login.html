<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - AlphaSeeker</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Public Navigation Bar -->
    <div th:replace="~{fragments/navbar-public :: navbar-public}"></div>

    <!-- Main Content -->
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
      <div class="row w-100 justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <div class="card shadow-sm border-0">
            <div class="card-body p-5">
              <!-- Header -->
              <div class="text-center mb-4">
                <div class="home-feature-icon bg-primary bg-opacity-10 text-primary mx-auto mb-3">
                  <i class="bi bi-person-circle"></i>
                </div>
                <h3 class="fw-bold text-dark" th:text="#{login.title}">Iniciar Sesión</h3>
              </div>

              <!-- Error Message -->
              <div
                th:if="${param.error}"
                class="alert alert-danger d-flex align-items-center"
                role="alert"
              >
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="#{login.error}">Usuario o contraseña incorrectos.</span>
              </div>

              <!-- Logout Message -->
              <div
                th:if="${param.logout}"
                class="alert alert-success d-flex align-items-center"
                role="alert"
              >
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="#{login.logout}">Sesión cerrada correctamente.</span>
              </div>

              <!-- Login Form -->
              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label for="username" class="form-label fw-semibold" th:text="#{login.username}">Usuario</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">
                      <i class="bi bi-person text-muted"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control"
                      id="username"
                      name="username"
                      required
                      autofocus
                      placeholder="admin"
                    />
                  </div>
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold" th:text="#{login.password}">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light">
                      <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      required
                      placeholder="admin"
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold"
                  th:text="#{login.submit}"
                >
                  Iniciar Sesión
                </button>
              </form>

              <!-- Back Link -->
              <div class="text-center mt-4">
                <a th:href="@{/}" class="text-muted text-decoration-none">
                  <i class="bi bi-arrow-left me-1"></i>
                  <span th:text="#{login.back}">Volver al inicio</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 bg-white border-top mt-auto">
      <div class="container text-center">
        <p class="text-muted mb-0">
          &copy; 2026 AlphaSeeker. Todos los derechos reservados.
        </p>
      </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
