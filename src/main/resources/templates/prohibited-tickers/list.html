<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Tickers Prohibidos - AlphaSeeker')}"></head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar(isAuthenticated=${true})}"></div>
    <div th:replace="~{fragments/notification :: notification}"></div>

    <main class="container my-5 flex-grow-1">
      <div class="page-header">
        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-3"
        >
          <div>
            <h2 class="mb-2">
              <i class="bi bi-shield-x me-2 text-primary"></i>
              <span th:text="#{prohibited.tickers.title}">Tickers Prohibidos</span>
            </h2>
            <p class="text-muted mb-0" th:text="#{prohibited.tickers.subtitle}">
              Revisa los tickers bloqueados por el sistema y elimínalos si es
              necesario.
            </p>
          </div>
          <div class="d-flex align-items-center gap-3">
            <span class="stats-badge" th:if="${!tickerPage.isEmpty()}">
              <i class="bi bi-collection me-1"></i>
              <span th:text="#{prohibited.tickers.count(${tickerPage.totalElements()})}">0 tickers prohibidos</span>
            </span>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div th:if="${tickerPage.isEmpty()}" class="text-center py-5">
            <i class="bi bi-shield-x text-muted fs-1"></i>
            <p class="text-muted fs-5 mt-3" th:text="#{prohibited.tickers.empty}">
              No se encontraron tickers prohibidos.
            </p>
          </div>

          <div th:if="${not(tickerPage.isEmpty())}" class="card">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover mb-0">
                  <thead class="table-light">
                    <tr>
                      <th scope="col" th:text="#{prohibited.tickers.table.ticker}">Ticker</th>
                      <th scope="col" th:text="#{prohibited.tickers.table.reason}">Razón</th>
                      <th scope="col" class="text-end" th:text="#{prohibited.tickers.table.actions}">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="prohibitedTicker : ${tickerPage.content()}">
                      <td
                        class="fw-semibold"
                        th:text="${prohibitedTicker.ticker}"
                      >
                        XYZ
                      </td>
                      <td
                        class="text-muted"
                        th:text="${prohibitedTicker.reason}"
                      >
                        Bloqueo manual
                      </td>
                      <td class="text-end">
                        <form
                          th:action="@{/prohibited-tickers/delete}"
                          method="post"
                          class="d-inline"
                        >
                          <input
                            th:if="${_csrf != null}"
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                          />
                          <input
                            type="hidden"
                            name="ticker"
                            th:value="${prohibitedTicker.ticker}"
                          />
                          <input
                            type="hidden"
                            name="tickerPage"
                            th:value="${tickerPage.pageNumber()}"
                          />
                          <input
                            type="hidden"
                            name="keywordPage"
                            th:value="${keywordPage.pageNumber()}"
                          />
                          <button
                            type="submit"
                            class="btn btn-sm btn-outline-danger"
                            th:data-confirm="#{prohibited.tickers.confirm_delete_ticker}"
                          >
                            <i class="bi bi-trash"></i> <span th:text="#{prohibited.tickers.delete}">Eliminar</span>
                          </button>
                        </form>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <div
              th:if="${tickerPage.totalPages() > 1}"
              class="card-footer bg-light"
            >
              <nav aria-label="#{prohibited.tickers.pagination_tickers}">
                <ul class="pagination pagination-sm mb-0 justify-content-center">
                  <li
                    class="page-item"
                    th:classappend="${!tickerPage.hasPrevious()} ? 'disabled'"
                  >
                    <a
                      class="page-link"
                      th:href="@{/prohibited-tickers(tickerPage=${tickerPage.pageNumber() - 1}, keywordPage=${keywordPage.pageNumber()})}"
                      th:aria-label="#{prohibited.tickers.prev}"
                    >
                      <i class="bi bi-chevron-left"></i>
                    </a>
                  </li>
                  <li
                    th:each="i : ${#numbers.sequence(0, tickerPage.totalPages() - 1)}"
                    class="page-item"
                    th:classappend="${i == tickerPage.pageNumber()} ? 'active'"
                  >
                    <a
                      class="page-link"
                      th:href="@{/prohibited-tickers(tickerPage=${i}, keywordPage=${keywordPage.pageNumber()})}"
                      th:text="${i + 1}"
                    ></a>
                  </li>
                  <li
                    class="page-item"
                    th:classappend="${!tickerPage.hasNext()} ? 'disabled'"
                  >
                    <a
                      class="page-link"
                      th:href="@{/prohibited-tickers(tickerPage=${tickerPage.pageNumber() + 1}, keywordPage=${keywordPage.pageNumber()})}"
                      th:aria-label="#{prohibited.tickers.next}"
                    >
                      <i class="bi bi-chevron-right"></i>
                    </a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>
        </div>

        <aside class="col-lg-4">
          <div class="card">
            <div
              class="card-header bg-light d-flex justify-content-between align-items-center"
            >
              <h3 class="h6 mb-0">
                <i class="bi bi-filter-circle me-1 text-primary"></i>
                <span th:text="#{prohibited.tickers.keywords.title}"
                  >Keywords prohibidas</span
                >
              </h3>
              <button
                class="btn btn-sm btn-outline-secondary d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#keywordsSidebar"
                aria-expanded="false"
                aria-controls="keywordsSidebar"
              >
                <span th:text="#{prohibited.tickers.keywords.toggle}">Ver</span>
              </button>
            </div>
            <div class="collapse show d-lg-block" id="keywordsSidebar">
              <div class="card-body">
                <form
                  th:action="@{/prohibited-tickers/keywords}"
                  method="post"
                  class="mb-3"
                >
                  <input
                    th:if="${_csrf != null}"
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                  />
                  <input
                    type="hidden"
                    name="tickerPage"
                    th:value="${tickerPage.pageNumber()}"
                  />
                  <input
                    type="hidden"
                    name="keywordPage"
                    th:value="${keywordPage.pageNumber()}"
                  />
                  <label
                    for="keyword"
                    class="form-label"
                    th:text="#{prohibited.tickers.keywords.new}"
                  >
                    Nueva keyword
                  </label>
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control"
                      id="keyword"
                      name="keyword"
                      maxlength="100"
                      required
                    />
                    <button type="submit" class="btn btn-primary">
                      <i class="bi bi-plus-lg"></i>
                    </button>
                  </div>
                </form>

                <div
                  th:if="${keywordPage.isEmpty()}"
                  class="text-muted small"
                >
                  <span th:text="#{prohibited.tickers.keywords.empty}"
                    >No hay keywords configuradas.</span
                  >
                </div>

                <ul
                  th:if="${not(keywordPage.isEmpty())}"
                  class="list-group list-group-flush"
                >
                  <li
                    th:each="prohibitedKeyword : ${keywordPage.content()}"
                    class="list-group-item d-flex justify-content-between align-items-center px-0"
                  >
                    <span
                      class="fw-semibold"
                      th:text="${prohibitedKeyword.keyword}"
                      >ETF</span
                    >
                    <form
                      th:action="@{/prohibited-tickers/keywords/delete}"
                      method="post"
                      class="d-inline"
                    >
                      <input
                        th:if="${_csrf != null}"
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                      />
                      <input
                        type="hidden"
                        name="keyword"
                        th:value="${prohibitedKeyword.keyword}"
                      />
                      <input
                        type="hidden"
                        name="tickerPage"
                        th:value="${tickerPage.pageNumber()}"
                      />
                      <input
                        type="hidden"
                        name="keywordPage"
                        th:value="${keywordPage.pageNumber()}"
                      />
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                        th:data-confirm="#{prohibited.tickers.confirm_delete_keyword}"
                      >
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </li>
                </ul>

                <div
                  th:if="${keywordPage.totalPages() > 1}"
                  class="mt-3"
                >
                  <nav aria-label="#{prohibited.tickers.pagination_keywords}">
                    <ul class="pagination pagination-sm mb-0 justify-content-center">
                      <li
                        class="page-item"
                        th:classappend="${!keywordPage.hasPrevious()} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/prohibited-tickers(tickerPage=${tickerPage.pageNumber()}, keywordPage=${keywordPage.pageNumber() - 1})}"
                          th:aria-label="#{prohibited.tickers.prev}"
                        >
                          <i class="bi bi-chevron-left"></i>
                        </a>
                      </li>
                      <li
                        th:each="i : ${#numbers.sequence(0, keywordPage.totalPages() - 1)}"
                        class="page-item"
                        th:classappend="${i == keywordPage.pageNumber()} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/prohibited-tickers(tickerPage=${tickerPage.pageNumber()}, keywordPage=${i})}"
                          th:text="${i + 1}"
                        ></a>
                      </li>
                      <li
                        class="page-item"
                        th:classappend="${!keywordPage.hasNext()} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/prohibited-tickers(tickerPage=${tickerPage.pageNumber()}, keywordPage=${keywordPage.pageNumber() + 1})}"
                          th:aria-label="#{prohibited.tickers.next}"
                        >
                          <i class="bi bi-chevron-right"></i>
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
  </body>
</html>
