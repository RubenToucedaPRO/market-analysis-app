<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickers Prohibidos - AlphaSeeker</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="container my-5 flex-grow-1">
      <!-- Message Alert -->
      <div th:replace="~{fragments/message :: message}"></div>

      <div class="page-header">
        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-3"
        >
          <div>
            <h2 class="mb-2">
              <i class="bi bi-shield-x me-2 text-primary"></i>
              Tickers Prohibidos
            </h2>
            <p class="text-muted mb-0">
              Revisa los tickers bloqueados por el sistema y elimínalos si es
              necesario.
            </p>
          </div>
          <div class="d-flex align-items-center gap-3">
            <span class="stats-badge" th:if="${!prohibitedTickers.isEmpty()}">
              <i class="bi bi-collection me-1"></i>
              <span th:text="${prohibitedTickers.size()}">0</span> tickers
              prohibidos
            </span>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div th:if="${prohibitedTickers.isEmpty()}" class="text-center py-5">
        <i class="bi bi-shield-x text-muted" style="font-size: 4rem"></i>
        <p class="text-muted fs-5 mt-3">
          No se encontraron tickers prohibidos.
        </p>
      </div>

      <!-- Prohibited Tickers Table -->
      <div th:unless="${prohibitedTickers.isEmpty()}" class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">Ticker</th>
                  <th scope="col">Razón</th>
                  <th scope="col" class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="prohibitedTicker : ${prohibitedTickers}">
                  <td class="fw-semibold" th:text="${prohibitedTicker.ticker}">
                    XYZ
                  </td>
                  <td class="text-muted" th:text="${prohibitedTicker.reason}">
                    Bloqueo manual
                  </td>
                  <td class="text-end">
                    <form
                      th:action="@{/prohibited-tickers/delete}"
                      method="post"
                      style="display: inline"
                    >
                      <input
                        type="hidden"
                        name="ticker"
                        th:value="${prohibitedTicker.ticker}"
                      />
                      <button
                        type="submit"
                        class="btn btn-sm btn-outline-danger"
                        onclick="
                          return confirm(
                            '¿Estás seguro de que quieres eliminar este ticker?',
                          );
                        "
                      >
                        <i class="bi bi-trash"></i> Eliminar
                      </button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-light border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted"
          >&copy; 2023 AlphaSeeker. Todos los derechos reservados.</small
        >
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
