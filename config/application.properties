# Spring Boot Application Properties

# Application Info
spring.application.name=market-analysis-app
info.app.name=Market Analysis Application
info.app.description=Motor de Análisis Técnico de Acciones - TFM Desarrollo con IA
info.app.version=1.0.0-SNAPSHOT
info.app.encoding=${project.build.sourceEncoding}
info.app.java.version=${java.version}

# ⚠️ IMPORTANTE: Cambiar según el entorno
# - Desarrollo local: dev
# - Docker local: docker
# - Producción: prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration App Spring Boot
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.devtools.restart.enabled=true

# Finnhub API Configuration
finnhub.api.token=${FINNHUB_API_TOKEN:}
finnhub.base.url=${FINNHUB_BASE_URL:}

# Polygon.io API Configuration
polygon.api.token=${POLYGON_API_TOKEN:}
polygon.base.url=${POLYGON_BASE_URL:}

# Openrouter API Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}

# Logging Configuration
logging.level.root=INFO
logging.level.com.marketanalysisapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Actuator Info Endpoint
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Prometheus Metrics
management.prometheus.metrics.export.enabled=true

# JPA/Hibernate Metrics
management.metrics.enable.hibernate=true
management.metrics.enable.jpa=true

# HikariCP Connection Pool Metrics
management.metrics.enable.hikari=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=true

# Registro del inspector (Es parte de tu arquitectura)
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.market.analysis.infrastructure.config.SlowQueryInspector

# Formateo (Ayuda a leer el log en cualquier entorno)
spring.jpa.properties.hibernate.format_sql=true

# Activación del log específico del inspector
logging.level.com.market.analysis.infrastructure.config.SlowQueryInspector=DEBUG