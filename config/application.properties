# Spring Boot Application Properties

# Application Info
spring.application.name=market-analysis-app

# ⚠️ IMPORTANTE: Cambiar según el entorno
# - Desarrollo local: dev
# - Docker local: docker
# - Producción: prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Fuerza a Spring AOP a generar proxies basados en la clase concreta (CGLIB) en lugar de la interfaz.
# Necesario en Arquitectura Hexagonal para que Spring detecte la anotación @RateLimiter colocada 
# en el adaptador de infraestructura (Finnhun) al inyectar el puerto (StockProviderPort) 
# en los casos de uso, evitando contaminar el dominio con dependencias del framework.
spring.aop.proxy-target-class=true

# Server Configuration App Spring Boot
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.devtools.restart.enabled=true

# Finnhub API Configuration
finnhub.api.token=${FINNHUB_API_TOKEN:}
finnhub.base.url=${FINNHUB_BASE_URL:https://finnhub.io/api/v1}

# Configuración del Rate Limiter para Finnhub
resilience4j.ratelimiter.instances.finnhubClient.limitForPeriod=55
resilience4j.ratelimiter.instances.finnhubClient.limitRefreshPeriod=65s
resilience4j.ratelimiter.instances.finnhubClient.timeoutDuration=65s

# Polygon.io API Configuration
polygon.api.token=${POLYGON_API_TOKEN:}
polygon.base.url=${POLYGON_BASE_URL:https://api.polygon.io/}

# Finviz Screener Configuration
finviz.base.url=${FINVIZ_BASE_URL:https://finviz.com/screener.ashx}
finviz.user-agent=${FINVIZ_USER_AGENT:Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36}
finviz.timeout-ms=${FINVIZ_TIMEOUT_MS:8000}
finviz.max-retries=${FINVIZ_MAX_RETRIES:1}
finviz.default.country-filter=${FINVIZ_DEFAULT_COUNTRY_FILTER:geo_usa}
finviz.default.industry-filter=${FINVIZ_DEFAULT_INDUSTRY_FILTER:ind_stocksonly}

# Openrouter API Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:google/gemma-4-31b-it:free}
openrouter.temperature=${OPENROUTER_TEMPERATURE:0.7}
openrouter.max-tokens=${OPENROUTER_MAX_TOKENS:500}
openrouter.top-p=${OPENROUTER_TOP_P:0.9}
openrouter.frequency-penalty=${OPENROUTER_FREQUENCY_PENALTY:0.5}

# Logging Configuration
logging.level.root=INFO
logging.level.com.marketanalysisapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration - Only health endpoint exposed
management.endpoints.web.exposure.include=health
# always show health details for better monitoring
management.endpoint.health.show-details=never

# Registro del inspector (Es parte de tu arquitectura)
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.market.analysis.infrastructure.config.SlowQueryInspector

# Formateo (Ayuda a leer el log en cualquier entorno)
spring.jpa.properties.hibernate.format_sql=false

# Activación del log específico del inspector
#logging.level.com.market.analysis.infrastructure.config.SlowQueryInspector=OFF

# Registra en el log cualquier consulta que tarde más de 500ms
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=5
# Necesario para ver los mensajes de advertencia de Hibernate sobre lentitud
logging.level.org.hibernate.SQL_SLOW=DEBUG

logging.level.io.github.resilience4j.ratelimiter=DEBUG
