# Production Profile - MySQL Database Configuration
# NOTE: Default values are for local Docker development ONLY.
# In real production, override via environment variables.

spring.devtools.add-properties=false

# Fuerza a Spring AOP a generar proxies basados en la clase concreta (CGLIB) en lugar de la interfaz.
# Necesario en Arquitectura Hexagonal para que Spring detecte la anotación @RateLimiter colocada 
# en el adaptador de infraestructura (PolygonAdapter) al inyectar el puerto (HistoricalProviderPort) 
# en los casos de uso, evitando contaminar el dominio con dependencias del framework.
spring.aop.proxy-target-class=true

# MySQL Database Configuration
# - SSL is disabled for local Docker development. Enable in production via DB_URL override.
# - allowPublicKeyRetrieval is for local development. Disable in production if using SSL.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update

# Disable H2 Console in production
spring.h2.console.enabled=false
