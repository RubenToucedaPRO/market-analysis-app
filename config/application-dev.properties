# Development Profile - H2 Database Configuration

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:marketanalysisdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Log queries that take longer than 500ms (threshold defined in SlowQueryInspector)
#spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500
# Show SQL statements in logs (debug level)
spring.jpa.show-sql=false

# Cache Configuration
spring.cache.type=simple
spring.web.resources.cache.period=0
