# Development Profile - H2 Database Configuration

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:marketanalysisdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Slow Query Logging Configuration
# Register the SlowQueryInspector for SQL statement inspection
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.market.analysis.infrastructure.config.SlowQueryInspector
# Log queries that take longer than 500ms (threshold defined in SlowQueryInspector)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500
# Show SQL statements in logs (debug level)
spring.jpa.show-sql=false
# Format SQL for better readability in logs
spring.jpa.properties.hibernate.format_sql=true
# Enable SQL logging at DEBUG level for the inspector
logging.level.com.market.analysis.infrastructure.config.SlowQueryInspector=DEBUG

# Cache Configuration
spring.cache.type=simple
spring.web.resources.cache.period=0
