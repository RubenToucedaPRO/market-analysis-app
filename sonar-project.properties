# Excluir regla Web:PageWithoutTitleCheck para plantillas Thymeleaf.
# El <title> se genera via th:replace con fragments/head.html,
# pero el analizador estatico no evalua expresiones Thymeleaf.
sonar.issue.ignore.multicriteria=tr1
sonar.issue.ignore.multicriteria.tr1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.tr1.language=web
sonar.issue.ignore.multicriteria.tr1.resourceKey=src/main/resources/templates/**
