# Fail2ban vive en el HOST, no en Docker.
# Lee /opt/apps/edge/logs/access.log (volumen ./logs del contenedor nginx en edge).
# y banea IPs con muchos 401/403. sshd se deja como está por defecto.

[Definition]
# Log combinado Nginx: 203.0.113.10 - - [29/Sep/2026:10:00:00 +0000] "GET /api/x HTTP/1.1" 401 ...
failregex = ^<HOST> - \S+ \[.*?\] "(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS) .* HTTP/.*" (401|403)( |$).*

# No contar el reto ACME de Let's Encrypt (devuelve 200, pero lo excluimos por seguridad)
ignoreregex = .*"/\.well-known/acme-challenge/.*"
