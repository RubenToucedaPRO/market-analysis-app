# EDGE base — NO lleva ningún server_name fijo.
# Cada proyecto aporta su fichero en conf.d/ (hoy solo tfm.conf).
# Así añadir otro proyecto = copiar 1 fichero + reload, sin tocar el del TFM.
# En el VPS: /opt/apps/edge/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;

  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
