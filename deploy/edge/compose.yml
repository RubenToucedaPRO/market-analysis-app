# EDGE — puerta de entrada compartida (SOLO nginx). Separado del TFM a propósito:
# el día que se despliegue otro proyecto se añadire su compose + 1 fichero en conf.d
# sin editar ni reiniciar el stack del TFM.
# En el VPS: /opt/apps/edge/compose.yml  (+ conf.d/, logs/)
# Red compartida (crear una vez): docker network create front

services:
  nginx:
    image: nginx:1.27
    container_name: nginx
    restart: unless-stopped
    ports:
      # ÚNICO servicio con puertos públicos en todo el VPS.
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - front
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  front:
    external: true
    name: front
