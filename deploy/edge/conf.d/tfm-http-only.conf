# ARRANQUE SIN CERT (paso A). Solo :80: challenge ACME + 200 de vida.
# Úsalo ANTES de tener /etc/letsencrypt/live/${TFM_DOMAIN}/*.pem
# (con tfm.conf completo Nginx no arranca: 'cannot load certificate').
# Tras Certbot (paso C): quita este fichero, restaura tfm.conf y haz reload.
server {
  listen 80;
  server_name ${TFM_DOMAIN};

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 200 'edge HTTP OK - pendiente cert';
    add_header Content-Type text/plain;
  }
}
