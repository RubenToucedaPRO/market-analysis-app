# Proyecto TFM — server COMPLETO (paso C, SOLO con certs ya emitidos).
# NO levantar edge con este fichero sin /etc/letsencrypt/live/${TFM_DOMAIN}/*.pem:
# Nginx entraría en bucle 'cannot load certificate'. Primero tfm-http-only.conf (paso A).
# En el VPS: /opt/apps/edge/conf.d/tfm.conf

# HTTP: reto ACME + redirección a HTTPS
server {
  listen 80;
  server_name ${TFM_DOMAIN};

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# TFM — Spring Boot (proxy a la red front compartida)
server {
  listen 443 ssl;
  http2 on;
  server_name ${TFM_DOMAIN};

  ssl_certificate /etc/letsencrypt/live/${TFM_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${TFM_DOMAIN}/privkey.pem;
  # Recomendado: ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
